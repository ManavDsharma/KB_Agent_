[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtp_operate_agent"
version = "2.3.0"
description = "DTP Operate conversational ITSM agent for Amazon Bedrock AgentCore Runtime (Strands Agents)"
requires-python = ">=3.10"

# Runtime dependencies only. Tests and local tools live in ../../local_dev
# and are not part of the deployment.
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.24.0",
    "boto3 >= 1.42.0",
    "botocore[crt] >= 1.42.0",
    "mcp ~= 1.24.0",
    "python-dotenv",
    "strands-agents >= 1.57.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
